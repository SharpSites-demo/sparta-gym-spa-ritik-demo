name: Verify reviewed-file publishing transport
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/reviewed-file-publisher-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify immutable reviewed HTML source
        shell: python
        run: |
          import hashlib, urllib.request
          source = 'https://raw.githubusercontent.com/SharpSites-demo/sparta-gym-spa-ritik-demo/6f7738fbef94b547e732ff9c60594912b7244267/index.html'
          with urllib.request.urlopen(source, timeout=30) as response:
              content = response.read()
          expected = '95f50cebcce322e5290de5211af3135a09b01fb4ca185ff2cef615784cd5f5bb'
          assert hashlib.sha256(content).hexdigest() == expected, 'Source hash mismatch'
          print('Exact reviewed HTML available for deterministic file transport; no AI build performed.')
